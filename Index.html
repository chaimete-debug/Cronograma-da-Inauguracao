<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{--navy:#1f4e78;--gold:#c49a3a;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#657180;--danger:#b42318;--ok:#166534}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--navy);color:white;padding:16px;position:sticky;top:0;z-index:3} header h1{font-size:18px;margin:0} header p{font-size:12px;margin:4px 0 0;opacity:.9}
    main{max-width:760px;margin:auto;padding:14px}.panel,.task{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}.input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px;background:white}textarea{min-height:80px;resize:vertical}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;font-size:15px;cursor:pointer}.primary{background:var(--navy);color:white;width:100%;margin-top:12px}.save{background:var(--gold);color:#151515;width:100%;margin-top:12px}.secondary{background:#e8edf2;color:var(--navy)}
    .hidden{display:none}.error{color:var(--danger);font-size:13px;margin-top:10px}.success{color:var(--ok);font-size:13px;margin-top:10px}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.kpi{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}.kpi b{display:block;font-size:20px;color:var(--navy)}.kpi span{font-size:11px;color:var(--muted)}
    .task h2{font-size:16px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.result{font-size:13px;background:#f7f9fb;padding:9px;border-radius:8px;margin:9px 0}
    .progressrow{display:flex;gap:10px;align-items:center}.progressrow input{flex:1}.percent{min-width:48px;font-weight:bold;color:var(--navy);text-align:right}
    .badge{display:inline-block;font-size:11px;border-radius:999px;padding:4px 8px;margin-top:7px;background:#eef2f6}.overdue{background:#fee2e2;color:#991b1b}.done{background:#dcfce7;color:#166534}.blocked{background:#fef3c7;color:#92400e}
    .toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar button{flex:1}.loading{text-align:center;color:var(--muted);padding:20px}
    .readonly-note{margin-top:10px;padding:10px;border-radius:9px;background:#eaf3f8;color:var(--navy);font-size:13px;font-weight:bold}
    .readonly-row{margin-top:10px;padding:10px;border:1px solid #dbe3eb;border-radius:10px;background:#fbfcfd}
    .readonly-row b{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    .progressbar{height:12px;border-radius:999px;background:#e5eaf0;overflow:hidden;margin-top:6px}
    .progressbar span{display:block;height:100%;background:var(--navy);border-radius:999px}
    @media(max-width:520px){.summary{grid-template-columns:repeat(2,1fr)}header h1{font-size:16px}.task{padding:14px}}
  </style>
</head>
<body>
<header><h1>Cronograma da Inauguração</h1><p>Igreja do Nazareno em Tchumene — 20 de Setembro de 2026</p></header>
<main>
  <section id="loginPanel" class="panel">
    <h2>Acesso do membro</h2>
    <label>Telefone</label><input id="phone" class="input" inputmode="tel" placeholder="Ex.: 84 000 0000">
    <label>PIN</label><input id="pin" class="input" inputmode="numeric" type="password" maxlength="8" placeholder="PIN atribuído">
    <button class="primary" onclick="login()">Entrar</button><div id="loginMsg"></div>
  </section>
  <section id="appPanel" class="hidden">
    <div class="panel"><b id="memberName"></b><div id="memberCommission" class="meta"></div><div id="accessNote"></div><button class="secondary" style="margin-top:10px" onclick="logout()">Sair</button></div>
    <div id="summary" class="summary"></div>
    <div class="toolbar"><button class="secondary" onclick="filterTasks('all')">Todas</button><button class="secondary" onclick="filterTasks('open')">Pendentes</button><button class="secondary" onclick="filterTasks('blocked')">Bloqueadas</button></div>
    <div id="tasks"><div class="loading">A carregar...</div></div>
  </section>
</main>
<script>
let session = null;
let allTasks = [];

function login() {
  const phone = document.getElementById('phone').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const msg = document.getElementById('loginMsg');

  msg.className = '';
  msg.textContent = 'A verificar...';

  google.script.run
    .withSuccessHandler(res => {
      if (!res.ok) {
        msg.className = 'error';
        msg.textContent = res.message;
        return;
      }

      session = {
        memberId: res.member.id,
        phone,
        pin,
        canEdit: res.member.canEdit
      };

      loadTasks();
    })
    .withFailureHandler(e => {
      msg.className = 'error';
      msg.textContent = e.message;
    })
    .authenticate(phone, pin);
}

function loadTasks() {
  document.getElementById('loginPanel').classList.add('hidden');
  document.getElementById('appPanel').classList.remove('hidden');

  google.script.run
    .withSuccessHandler(res => {
      session.canEdit = res.member.canEdit;

      document.getElementById('memberName').textContent = res.member.name;
      document.getElementById('memberCommission').textContent =
        res.member.commission + ' — ' + res.member.role;

      document.getElementById('accessNote').innerHTML = res.member.canEdit
        ? ''
        : '<div class="readonly-note">Acesso somente para visualização. Não é possível alterar os dados.</div>';

      allTasks = res.tasks;
      renderSummary(res.summary);
      renderTasks(allTasks);
    })
    .withFailureHandler(e => alert(e.message))
    .getTasks(session.memberId, session.phone, session.pin);
}

function renderSummary(s) {
  document.getElementById('summary').innerHTML =
    `<div class="kpi"><b>${s.total}</b><span>Actividades</span></div>
     <div class="kpi"><b>${s.completed}</b><span>Concluídas</span></div>
     <div class="kpi"><b>${s.blocked}</b><span>Bloqueadas</span></div>
     <div class="kpi"><b>${s.average}%</b><span>Execução média</span></div>`;
}

function filterTasks(type) {
  let tasks = allTasks;

  if (type === 'open') {
    tasks = tasks.filter(task => task.estado !== 'Concluída');
  }

  if (type === 'blocked') {
    tasks = tasks.filter(task => task.estado === 'Bloqueada');
  }

  renderTasks(tasks);
}

function renderTasks(tasks) {
  const root = document.getElementById('tasks');

  if (!tasks.length) {
    root.innerHTML = '<div class="panel">Nenhuma actividade para apresentar.</div>';
    return;
  }

  root.innerHTML = tasks.map(task => {
    const badgeClass =
      task.estado === 'Concluída'
        ? 'done'
        : task.estado === 'Bloqueada'
          ? 'blocked'
          : String(task.situacaoPrazo).toLowerCase().includes('atras')
            ? 'overdue'
            : '';

    const commonHeader =
      `<h2>${task.id}. ${esc(task.actividade)}</h2>
       <div class="meta">
         <b>Prazo:</b> ${esc(task.prazo)}<br>
         <b>Responsável:</b> ${esc(task.responsavel)}<br>
         <span class="badge ${badgeClass}">${esc(task.situacaoPrazo || task.estado)}</span>
       </div>
       <div class="result"><b>Resultado esperado:</b> ${esc(task.resultado)}</div>`;

    if (!session.canEdit) {
      return `<article class="task" id="task-${task.rowNumber}">
        ${commonHeader}
        <div class="readonly-row">
          <b>Estado actual</b>
          ${esc(task.estado)}
        </div>
        <div class="readonly-row">
          <b>Nível de execução</b>
          <strong>${task.execucao}%</strong>
          <div class="progressbar"><span style="width:${task.execucao}%"></span></div>
        </div>
        <div class="readonly-row">
          <b>Observação / Próxima acção</b>
          ${esc(task.observacao || 'Sem observação registada.')}
        </div>
        <div class="meta">
          Última actualização: ${esc(task.actualizadoEm || 'Sem registo')}
          ${task.actualizadoPor ? ' — ' + esc(task.actualizadoPor) : ''}
        </div>
      </article>`;
    }

    return `<article class="task" id="task-${task.rowNumber}">
      ${commonHeader}
      <label>Estado</label>
      <select id="status-${task.rowNumber}">
        <option ${sel(task.estado, 'Não iniciada')}>Não iniciada</option>
        <option ${sel(task.estado, 'Em curso')}>Em curso</option>
        <option ${sel(task.estado, 'Bloqueada')}>Bloqueada</option>
        <option ${sel(task.estado, 'Concluída')}>Concluída</option>
      </select>

      <label>Nível de execução</label>
      <div class="progressrow">
        <input
          type="range"
          min="0"
          max="100"
          step="5"
          value="${task.execucao}"
          id="pct-${task.rowNumber}"
          oninput="document.getElementById('pctv-${task.rowNumber}').textContent=this.value+'%'"
        >
        <span class="percent" id="pctv-${task.rowNumber}">${task.execucao}%</span>
      </div>

      <label>Observação / Próxima acção</label>
      <textarea id="obs-${task.rowNumber}">${esc(task.observacao)}</textarea>

      <div class="meta">
        Última actualização: ${esc(task.actualizadoEm || 'Sem registo')}
        ${task.actualizadoPor ? ' — ' + esc(task.actualizadoPor) : ''}
      </div>

      <button class="save" onclick="saveTask(${task.rowNumber})">Guardar actualização</button>
      <div id="msg-${task.rowNumber}"></div>
    </article>`;
  }).join('');
}

function saveTask(rowNumber) {
  if (!session || !session.canEdit) {
    alert('Este acesso é apenas para visualização.');
    return;
  }

  const payload = {
    memberId: session.memberId,
    phone: session.phone,
    pin: session.pin,
    rowNumber,
    estado: document.getElementById('status-' + rowNumber).value,
    execucao: Number(document.getElementById('pct-' + rowNumber).value),
    observacao: document.getElementById('obs-' + rowNumber).value
  };

  const msg = document.getElementById('msg-' + rowNumber);
  msg.className = '';
  msg.textContent = 'A guardar...';

  google.script.run
    .withSuccessHandler(res => {
      msg.className = 'success';
      msg.textContent = res.message;
      setTimeout(loadTasks, 500);
    })
    .withFailureHandler(e => {
      msg.className = 'error';
      msg.textContent = e.message;
    })
    .updateTask(payload);
}

function logout() {
  session = null;
  allTasks = [];

  document.getElementById('appPanel').classList.add('hidden');
  document.getElementById('loginPanel').classList.remove('hidden');
  document.getElementById('pin').value = '';
  document.getElementById('loginMsg').textContent = '';
}

function sel(a, b) {
  return a === b ? 'selected' : '';
}

function esc(value) {
  return String(value ?? '').replace(
    /[&<>'"]/g,
    char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[char])
  );
}
</script>
</body>
</html>
