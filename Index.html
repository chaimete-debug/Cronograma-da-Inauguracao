<!DOCTYPE html>
<html lang="pt">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{
      --navy:#123a68;
      --navy-dark:#0a2248;
      --gold:#c49a3a;
      --bg:#f2f5f8;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#64748b;
      --line:#d9e1e8;
      --danger:#b42318;
      --danger-bg:#fee4e2;
      --ok:#166534;
      --ok-bg:#dcfce7;
      --warning:#92400e;
      --warning-bg:#fef3c7;
      --info:#1d4ed8;
      --info-bg:#dbeafe;
      --shadow:0 4px 18px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    header{
      position:sticky;
      top:0;
      z-index:20;
      background:linear-gradient(135deg,var(--navy-dark),var(--navy));
      color:#fff;
      padding:13px 15px;
      box-shadow:0 3px 12px rgba(0,0,0,.18);
    }
    header h1{font-size:18px;margin:0}
    header p{font-size:12px;margin:4px 0 0;color:#d8e4f1}
    main{max-width:920px;margin:0 auto;padding:14px}
    .panel,.task{
      background:var(--card);
      border:1px solid rgba(217,225,232,.85);
      border-radius:15px;
      box-shadow:var(--shadow);
      padding:15px;
      margin-bottom:12px;
    }
    .login-logo{
      width:58px;height:58px;border-radius:15px;
      display:grid;place-items:center;
      margin:0 auto 10px;
      background:var(--navy-dark);
      color:var(--gold);
      font-size:28px;
      font-weight:bold;
    }
    .login-title{text-align:center;margin:4px 0 2px}
    .login-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px}
    label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px;color:#334155}
    .input,select,textarea{
      width:100%;
      border:1px solid #cbd5e1;
      border-radius:10px;
      padding:11px 12px;
      font-size:15px;
      background:#fff;
      color:var(--text);
      outline:none;
    }
    .input:focus,select:focus,textarea:focus{
      border-color:var(--navy);
      box-shadow:0 0 0 3px rgba(18,58,104,.12);
    }
    textarea{min-height:76px;resize:vertical}
    button{
      border:0;border-radius:10px;
      padding:11px 14px;
      font-weight:700;
      font-size:14px;
    }
    .primary{background:var(--navy);color:#fff}
    .primary:hover{background:var(--navy-dark)}
    .gold{background:var(--gold);color:#171717}
    .secondary{background:#e9eff5;color:var(--navy-dark)}
    .danger{background:#fee4e2;color:var(--danger)}
    .success-btn{background:#166534;color:#fff}
    .full{width:100%}
    .hidden{display:none!important}
    .error,.success,.notice{font-size:13px;margin-top:10px;padding:9px 10px;border-radius:9px}
    .error{color:var(--danger);background:var(--danger-bg)}
    .success{color:var(--ok);background:var(--ok-bg)}
    .notice{color:var(--info);background:var(--info-bg)}
    .member-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .member-row b{font-size:15px}
    .meta{font-size:12px;color:var(--muted);line-height:1.48}
    .readonly-note{
      margin-top:9px;padding:9px 10px;border-radius:9px;
      background:var(--info-bg);color:var(--info);font-size:12px;font-weight:700;
    }
    .summary{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:12px;
    }
    .kpi{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 7px;
      text-align:center;
      box-shadow:0 2px 8px rgba(15,23,42,.05);
    }
    .kpi b{display:block;font-size:20px;color:var(--navy-dark)}
    .kpi span{font-size:10px;color:var(--muted);line-height:1.2}
    .filters{
      display:grid;
      grid-template-columns:1.15fr 1fr auto;
      gap:8px;
      align-items:center;
      margin-bottom:12px;
    }
    .task{position:relative;overflow:hidden}
    .task.attention{border-left:5px solid var(--danger)}
    .task.waiting{border-left:5px solid var(--info)}
    .task.completed{border-left:5px solid var(--ok)}
    .task.blocked{border-left:5px solid var(--gold)}
    .task h2{font-size:16px;margin:0 0 6px;line-height:1.35}
    .task-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .task-id{color:var(--navy);font-weight:800}
    .badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
    .badge{
      display:inline-block;
      font-size:10px;
      border-radius:999px;
      padding:4px 8px;
      background:#eef2f6;
      color:#334155;
      font-weight:700;
    }
    .badge.done{background:var(--ok-bg);color:var(--ok)}
    .badge.blocked{background:var(--warning-bg);color:var(--warning)}
    .badge.overdue{background:var(--danger-bg);color:var(--danger)}
    .badge.waiting{background:var(--info-bg);color:var(--info)}
    .badge.stale{background:#f3e8ff;color:#7e22ce}
    .result{
      font-size:13px;
      background:#f7f9fb;
      padding:9px 10px;
      border-radius:9px;
      margin:9px 0;
      line-height:1.4;
    }
    .progress-box{margin:10px 0}
    .progress-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
    .progressbar{
      height:12px;border-radius:999px;background:#e4eaf0;
      overflow:hidden;margin-top:6px;
    }
    .progressbar span{
      display:block;height:100%;
      background:linear-gradient(90deg,var(--navy),#3b82f6);
      border-radius:999px;
    }
    .editor{
      border-top:1px solid var(--line);
      margin-top:12px;
      padding-top:12px;
    }
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quick-percent{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
    .quick-percent button{
      padding:6px 9px;font-size:11px;background:#e9eff5;color:var(--navy-dark)
    }
    .progressrow{display:flex;gap:10px;align-items:center}
    .progressrow input{flex:1}
    .percent{min-width:48px;text-align:right;font-weight:800;color:var(--navy)}
    .readonly-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px
    }
    .readonly-row{
      padding:9px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd;
      font-size:13px;line-height:1.4
    }
    .readonly-row b{display:block;color:var(--muted);font-size:10px;margin-bottom:4px;text-transform:uppercase}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .actions button{flex:1;min-width:130px}
    .validation-box{
      margin-top:12px;padding:11px;border-radius:11px;background:#eff6ff;border:1px solid #bfdbfe
    }
    .validation-box h3{font-size:14px;margin:0 0 7px;color:var(--info)}
    .history-box{
      margin-top:10px;border-top:1px dashed var(--line);padding-top:10px
    }
    .history-item{
      background:#f8fafc;border:1px solid var(--line);
      border-radius:9px;padding:9px;margin-bottom:7px;font-size:12px;line-height:1.42
    }
    .empty{text-align:center;color:var(--muted);padding:25px 12px}
    .loading{text-align:center;color:var(--muted);padding:25px}
    .footer-note{text-align:center;color:var(--muted);font-size:10px;padding:5px 0 15px}
    #toast{
      position:fixed;
      left:50%;bottom:18px;transform:translateX(-50%);
      max-width:min(92%,520px);
      padding:11px 15px;border-radius:10px;
      color:#fff;background:#111827;
      box-shadow:0 8px 28px rgba(0,0,0,.25);
      z-index:50;font-size:13px;
      opacity:0;pointer-events:none;transition:.2s;
    }
    #toast.show{opacity:1}
    #toast.ok{background:#166534}
    #toast.bad{background:#991b1b}
    @media(max-width:700px){
      .summary{grid-template-columns:repeat(3,1fr)}
      .filters{grid-template-columns:1fr}
      .form-grid,.readonly-grid{grid-template-columns:1fr}
      .task-top{display:block}
    }
    @media(max-width:430px){
      main{padding:10px}
      .panel,.task{padding:13px;border-radius:13px}
      .summary{grid-template-columns:repeat(2,1fr)}
      header h1{font-size:16px}
      .actions button{min-width:100%}
    }
  </style>
</head>
<body>
  <header>
    <h1>Execução das Actividades</h1>
    <p>Inauguração do Templo — 20 de Setembro de 2026</p>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <div class="login-logo">✓</div>
      <h2 class="login-title">Acesso ao cronograma</h2>
      <p class="login-sub">Entre com o telefone e o PIN atribuídos.</p>

      <label for="phone">Telefone</label>
      <input id="phone" class="input" inputmode="tel" autocomplete="tel" placeholder="Ex.: 84 000 0000">

      <label for="pin">PIN</label>
      <input id="pin" class="input" inputmode="numeric" type="password" maxlength="8" placeholder="PIN atribuído">

      <button id="loginButton" class="primary full" style="margin-top:12px" onclick="login()">Entrar</button>
      <div id="loginMsg"></div>
    </section>

    <section id="appPanel" class="hidden">
      <div class="panel">
        <div class="member-row">
          <div>
            <b id="memberName"></b>
            <div id="memberCommission" class="meta"></div>
            <div id="accessNote"></div>
          </div>
          <button class="secondary" onclick="logout()">Sair</button>
        </div>
      </div>

      <div id="summary" class="summary"></div>

      <div class="panel" style="padding:10px">
        <div class="filters">
          <select id="statusFilter" onchange="applyFilters()">
            <option value="attention">Atenção prioritária</option>
            <option value="all">Todas as actividades</option>
            <option value="open">Em aberto</option>
            <option value="blocked">Bloqueadas</option>
            <option value="awaiting">Aguardam validação</option>
            <option value="overdue">Atrasadas</option>
            <option value="stale">Sem actualização recente</option>
            <option value="completed">Concluídas</option>
          </select>
          <input id="searchBox" class="input" placeholder="Pesquisar actividade..." oninput="applyFilters()">
          <button class="secondary" onclick="loadTasks()">Actualizar</button>
        </div>
        <div id="generatedAt" class="meta"></div>
      </div>

      <div id="tasks"><div class="loading">A carregar...</div></div>
      <div class="footer-note">Todas as alterações ficam registadas no histórico.</div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    let session = null;
    let allTasks = [];
    let currentMember = null;
    let toastTimer = null;

    function login() {
      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const msg = document.getElementById('loginMsg');
      const button = document.getElementById('loginButton');

      if (!phone || !pin) {
        showInline(msg, 'Informe o telefone e o PIN.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'A verificar...';
      msg.innerHTML = '';

      google.script.run
        .withSuccessHandler(res => {
          button.disabled = false;
          button.textContent = 'Entrar';

          if (!res.ok) {
            showInline(msg, res.message, 'error');
            return;
          }

          session = {
            memberId: res.member.id,
            phone: phone,
            pin: pin
          };

          currentMember = res.member;
          loadTasks();
        })
        .withFailureHandler(error => {
          button.disabled = false;
          button.textContent = 'Entrar';
          showInline(msg, getErrorMessage(error), 'error');
        })
        .authenticate(phone, pin);
    }

    function loadTasks() {
      if (!session) return;

      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('appPanel').classList.remove('hidden');
      document.getElementById('tasks').innerHTML = '<div class="loading">A carregar actividades...</div>';

      google.script.run
        .withSuccessHandler(res => {
          currentMember = res.member;
          allTasks = res.tasks || [];

          document.getElementById('memberName').textContent = res.member.name;
          document.getElementById('memberCommission').textContent =
            res.member.commission + ' — ' + res.member.role;

          document.getElementById('accessNote').innerHTML = res.member.canEdit
            ? ''
            : '<div class="readonly-note">Acesso apenas para visualização. Não é possível alterar dados.</div>';

          document.getElementById('generatedAt').textContent =
            'Informação actualizada em ' + (res.generatedAt || '');

          renderSummary(res.summary);
          applyFilters();
        })
        .withFailureHandler(error => {
          showToast(getErrorMessage(error), false);
          if (getErrorMessage(error).toLowerCase().includes('sessão')) logout();
        })
        .getTasks(session.memberId, session.phone, session.pin);
    }

    function renderSummary(summary) {
      document.getElementById('summary').innerHTML = [
        kpi(summary.total, 'Actividades'),
        kpi(summary.average + '%', 'Execução média'),
        kpi(summary.blocked, 'Bloqueadas'),
        kpi(summary.overdue, 'Atrasadas'),
        kpi(summary.awaiting, 'Aguardam validação'),
        kpi(summary.completed, 'Concluídas'),
        kpi(summary.stale, 'Sem actualização')
      ].join('');
    }

    function kpi(value, label) {
      return `<div class="kpi"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
    }

    function applyFilters() {
      const type = document.getElementById('statusFilter').value;
      const query = normalise(document.getElementById('searchBox').value);

      let tasks = allTasks.filter(task => {
        const text = normalise([
          task.id, task.actividade, task.responsavel, task.resultado,
          task.progresso, task.proximaAccao, task.impedimento, task.apoio
        ].join(' '));

        if (query && !text.includes(query)) return false;

        if (type === 'all') return true;
        if (type === 'open') return task.estado !== 'Concluída';
        if (type === 'blocked') return task.estado === 'Bloqueada';
        if (type === 'awaiting') return task.estado === 'Aguarda validação';
        if (type === 'overdue') return task.situacaoPrazo === 'Atrasada';
        if (type === 'stale') return task.semActualizacao;
        if (type === 'completed') return task.estado === 'Concluída';

        if (type === 'attention') {
          return (
            task.estado === 'Bloqueada' ||
            task.estado === 'Aguarda validação' ||
            task.situacaoPrazo === 'Atrasada' ||
            task.situacaoPrazo === 'Urgente' ||
            task.semActualizacao
          );
        }

        return true;
      });

      renderTasks(tasks);
    }

    function renderTasks(tasks) {
      const root = document.getElementById('tasks');

      if (!tasks.length) {
        root.innerHTML = '<div class="panel empty">Nenhuma actividade corresponde ao filtro seleccionado.</div>';
        return;
      }

      root.innerHTML = tasks.map(renderTaskCard).join('');
    }

    function renderTaskCard(task) {
      const key = encodeURIComponent(task.id);
      const classes = [
        'task',
        task.estado === 'Bloqueada' ? 'blocked' : '',
        task.estado === 'Aguarda validação' ? 'waiting' : '',
        task.estado === 'Concluída' ? 'completed' : '',
        task.situacaoPrazo === 'Atrasada' || task.situacaoPrazo === 'Urgente' ? 'attention' : ''
      ].filter(Boolean).join(' ');

      const badges = [
        badge(task.estado, statusClass(task.estado)),
        badge(task.situacaoPrazo, deadlineClass(task.situacaoPrazo)),
        task.semActualizacao ? badge('Sem actualização recente', 'stale') : '',
        task.estadoValidacao && task.estadoValidacao !== 'Pendente'
          ? badge(task.estadoValidacao, task.estadoValidacao === 'Validada' ? 'done' : 'waiting')
          : ''
      ].join('');

      const header = `
        <div class="task-top">
          <h2><span class="task-id">${esc(task.id)}.</span> ${esc(task.actividade)}</h2>
        </div>
        <div class="meta">
          <b>Prazo:</b> ${esc(task.prazo || task.dataLimite || 'Sem prazo')}<br>
          <b>Responsável:</b> ${esc(task.responsavel || 'Por indicar')}
        </div>
        <div class="badges">${badges}</div>
        <div class="result"><b>Resultado esperado:</b> ${esc(task.resultado || 'Não indicado')}</div>
        ${renderProgress(task)}
      `;

      let body = renderReadOnlyDetails(task);

      if (task.podeEditar) {
        body += renderEditor(task, key);
      } else if (
        task.estado === 'Aguarda validação' &&
        !task.podeValidar &&
        currentMember.canEdit
      ) {
        body += '<div class="notice">Esta actividade foi submetida e está bloqueada até à decisão da Coordenação.</div>';
      }

      if (task.podeValidar && task.estado === 'Aguarda validação') {
        body += renderValidationPanel(task, key, 'awaiting');
      }

      if (task.podeValidar && task.estado === 'Concluída') {
        body += renderValidationPanel(task, key, 'completed');
      }

      body += `
        <div class="actions">
          <button class="secondary" onclick="toggleHistory('${key}')">Ver histórico</button>
        </div>
        <div id="history-${key}" class="history-box hidden"></div>
      `;

      return `<article class="${classes}" id="task-${key}">${header}${body}</article>`;
    }

    function renderProgress(task) {
      return `
        <div class="progress-box">
          <div class="progress-head">
            <span>Nível de execução</span>
            <span>${esc(task.execucao)}%</span>
          </div>
          <div class="progressbar"><span style="width:${Number(task.execucao) || 0}%"></span></div>
        </div>
      `;
    }

    function renderReadOnlyDetails(task) {
      const cells = [];

      if (task.progresso) cells.push(readonlyCell('Progresso realizado', task.progresso));
      if (task.proximaAccao) cells.push(readonlyCell('Próxima acção', task.proximaAccao));
      if (task.impedimento) cells.push(readonlyCell('Impedimento / Risco', task.impedimento));
      if (task.apoio) cells.push(readonlyCell('Apoio necessário', task.apoio));
      if (task.evidencia) {
        cells.push(`
          <div class="readonly-row">
            <b>Evidência</b>
            <a href="${attr(task.evidencia)}" target="_blank" rel="noopener">Abrir ligação</a>
          </div>
        `);
      }
      if (task.proximaActualizacao) {
        cells.push(readonlyCell('Próxima actualização', task.proximaActualizacao));
      }

      let validation = '';
      if (task.notaValidacao || task.validadoPor) {
        validation = `
          <div class="validation-box">
            <h3>Validação</h3>
            <div class="meta">
              <b>Estado:</b> ${esc(task.estadoValidacao || '')}<br>
              ${task.notaValidacao ? '<b>Nota:</b> ' + esc(task.notaValidacao) + '<br>' : ''}
              ${task.validadoPor ? '<b>Por:</b> ' + esc(task.validadoPor) + ' ' + esc(task.validadoEm || '') : ''}
            </div>
          </div>
        `;
      }

      return `
        ${cells.length ? '<div class="readonly-grid">' + cells.join('') + '</div>' : ''}
        <div class="meta" style="margin-top:9px">
          Última actualização: ${esc(task.actualizadoEm || 'Sem registo')}
          ${task.actualizadoPor ? ' — ' + esc(task.actualizadoPor) : ''}
        </div>
        ${validation}
      `;
    }

    function readonlyCell(label, value) {
      return `<div class="readonly-row"><b>${esc(label)}</b>${nl2br(value)}</div>`;
    }

    function renderEditor(task, key) {
      const statusOptions = ['Não iniciada', 'Em curso', 'Bloqueada', 'Aguarda validação']
        .map(status => `<option value="${attr(status)}" ${task.estado === status ? 'selected' : ''}>${esc(status)}</option>`)
        .join('');

      return `
        <div class="editor">
          <div class="form-grid">
            <div>
              <label for="status-${key}">Estado</label>
              <select id="status-${key}" onchange="statusChanged('${key}')">${statusOptions}</select>
            </div>
            <div>
              <label for="nextdate-${key}">Data da próxima actualização</label>
              <input id="nextdate-${key}" class="input" type="date" value="${attr(task.proximaActualizacaoIso || '')}">
            </div>
          </div>

          <label>Nível de execução</label>
          <div class="progressrow">
            <input
              type="range"
              min="0"
              max="100"
              step="5"
              value="${Number(task.execucao) || 0}"
              id="pct-${key}"
              oninput="percentChanged('${key}')"
            >
            <span class="percent" id="pctv-${key}">${Number(task.execucao) || 0}%</span>
          </div>
          <div class="quick-percent">
            <button type="button" onclick="setPercent('${key}',0)">0%</button>
            <button type="button" onclick="setPercent('${key}',25)">25%</button>
            <button type="button" onclick="setPercent('${key}',50)">50%</button>
            <button type="button" onclick="setPercent('${key}',75)">75%</button>
            <button type="button" onclick="setPercent('${key}',100)">100%</button>
          </div>

          <label for="progress-${key}">Progresso realizado</label>
          <textarea id="progress-${key}" placeholder="Descreva o que foi efectivamente realizado.">${esc(task.progresso || '')}</textarea>

          <label for="next-${key}">Próxima acção</label>
          <textarea id="next-${key}" placeholder="Indique o passo seguinte, responsável e prazo, quando possível.">${esc(task.proximaAccao || '')}</textarea>

          <div class="form-grid">
            <div>
              <label for="blocker-${key}">Impedimento / Risco</label>
              <textarea id="blocker-${key}" placeholder="Obrigatório quando o estado for Bloqueada.">${esc(task.impedimento || '')}</textarea>
            </div>
            <div>
              <label for="support-${key}">Apoio necessário</label>
              <textarea id="support-${key}" placeholder="Indique a decisão, recurso ou apoio necessário.">${esc(task.apoio || '')}</textarea>
            </div>
          </div>

          <label for="evidence-${key}">Evidência / ligação</label>
          <input id="evidence-${key}" class="input" type="url" placeholder="https://..." value="${attr(task.evidencia || '')}">

          <button id="save-${key}" class="gold full" style="margin-top:12px" onclick="saveTask('${key}')">
            Guardar actualização
          </button>
          <div id="msg-${key}"></div>
        </div>
      `;
    }

    function renderValidationPanel(task, key, mode) {
      if (mode === 'awaiting') {
        return `
          <div class="validation-box">
            <h3>Decisão da Coordenação</h3>
            <label for="validation-note-${key}">Nota de validação ou correcção</label>
            <textarea id="validation-note-${key}" placeholder="Obrigatória apenas em caso de devolução."></textarea>
            <div class="actions">
              <button class="success-btn" onclick="validateTask('${key}','approve')">Validar conclusão</button>
              <button class="danger" onclick="validateTask('${key}','return')">Devolver para correcção</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="validation-box">
          <h3>Actividade validada</h3>
          <label for="validation-note-${key}">Motivo da reabertura</label>
          <textarea id="validation-note-${key}" placeholder="Indique a razão pela qual a actividade deve voltar a Em curso."></textarea>
          <button class="danger full" style="margin-top:9px" onclick="validateTask('${key}','reopen')">
            Reabrir actividade
          </button>
        </div>
      `;
    }

    function statusChanged(key) {
      const status = document.getElementById('status-' + key).value;
      if (status === 'Aguarda validação') setPercent(key, 100);
    }

    function percentChanged(key) {
      const range = document.getElementById('pct-' + key);
      const value = Number(range.value);
      document.getElementById('pctv-' + key).textContent = value + '%';

      const status = document.getElementById('status-' + key);
      if (value === 0 && status.value !== 'Bloqueada') status.value = 'Não iniciada';
      if (value > 0 && value < 100 && status.value === 'Não iniciada') status.value = 'Em curso';
      if (value === 100) status.value = 'Aguarda validação';
    }

    function setPercent(key, value) {
      const range = document.getElementById('pct-' + key);
      range.value = value;
      percentChanged(key);
    }

    function saveTask(key) {
      const taskId = decodeURIComponent(key);
      const button = document.getElementById('save-' + key);
      const msg = document.getElementById('msg-' + key);

      const payload = {
        memberId: session.memberId,
        phone: session.phone,
        pin: session.pin,
        taskId: taskId,
        estado: document.getElementById('status-' + key).value,
        execucao: Number(document.getElementById('pct-' + key).value),
        progresso: document.getElementById('progress-' + key).value,
        proximaAccao: document.getElementById('next-' + key).value,
        impedimento: document.getElementById('blocker-' + key).value,
        apoio: document.getElementById('support-' + key).value,
        evidencia: document.getElementById('evidence-' + key).value,
        proximaActualizacao: document.getElementById('nextdate-' + key).value
      };

      button.disabled = true;
      button.textContent = 'A guardar...';
      msg.innerHTML = '';

      google.script.run
        .withSuccessHandler(res => {
          button.disabled = false;
          button.textContent = 'Guardar actualização';
          showInline(msg, res.message, 'success');
          showToast(res.message, true);
          setTimeout(loadTasks, 500);
        })
        .withFailureHandler(error => {
          button.disabled = false;
          button.textContent = 'Guardar actualização';
          showInline(msg, getErrorMessage(error), 'error');
        })
        .updateTask(payload);
    }

    function validateTask(key, decision) {
      const taskId = decodeURIComponent(key);
      const noteElement = document.getElementById('validation-note-' + key);
      const note = noteElement ? noteElement.value : '';

      if ((decision === 'return' || decision === 'reopen') && note.trim().length < 5) {
        showToast('Indique o motivo da decisão.', false);
        return;
      }

      google.script.run
        .withSuccessHandler(res => {
          showToast(res.message, true);
          setTimeout(loadTasks, 350);
        })
        .withFailureHandler(error => showToast(getErrorMessage(error), false))
        .validateTask({
          memberId: session.memberId,
          phone: session.phone,
          pin: session.pin,
          taskId: taskId,
          decision: decision,
          note: note
        });
    }

    function toggleHistory(key) {
      const box = document.getElementById('history-' + key);

      if (!box.classList.contains('hidden')) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');
      box.innerHTML = '<div class="loading">A carregar histórico...</div>';

      google.script.run
        .withSuccessHandler(entries => {
          if (!entries.length) {
            box.innerHTML = '<div class="meta">Ainda não existem registos para esta actividade.</div>';
            return;
          }

          box.innerHTML = entries.map(entry => `
            <div class="history-item">
              <b>${esc(entry.accao)}</b> — ${esc(entry.data)}<br>
              <span class="meta">${esc(entry.membro)}</span><br>
              ${esc(entry.estadoAnterior)} (${esc(entry.execucaoAnterior)}%)
              → <b>${esc(entry.novoEstado)} (${esc(entry.novaExecucao)}%)</b>
              ${entry.progresso ? '<br><b>Progresso:</b> ' + nl2br(entry.progresso) : ''}
              ${entry.proximaAccao ? '<br><b>Próxima acção:</b> ' + nl2br(entry.proximaAccao) : ''}
              ${entry.impedimento ? '<br><b>Impedimento:</b> ' + nl2br(entry.impedimento) : ''}
              ${entry.notaValidacao ? '<br><b>Nota:</b> ' + nl2br(entry.notaValidacao) : ''}
            </div>
          `).join('');
        })
        .withFailureHandler(error => {
          box.innerHTML = '<div class="error">' + esc(getErrorMessage(error)) + '</div>';
        })
        .getTaskHistory(
          session.memberId,
          session.phone,
          session.pin,
          decodeURIComponent(key)
        );
    }

    function logout() {
      session = null;
      currentMember = null;
      allTasks = [];
      document.getElementById('appPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
      document.getElementById('pin').value = '';
      document.getElementById('loginMsg').innerHTML = '';
    }

    function badge(text, cssClass) {
      if (!text) return '';
      return `<span class="badge ${cssClass || ''}">${esc(text)}</span>`;
    }

    function statusClass(status) {
      if (status === 'Concluída') return 'done';
      if (status === 'Bloqueada') return 'blocked';
      if (status === 'Aguarda validação') return 'waiting';
      return '';
    }

    function deadlineClass(label) {
      if (label === 'Atrasada' || label === 'Urgente') return 'overdue';
      if (label === 'Concluída') return 'done';
      if (label === 'Bloqueada') return 'blocked';
      if (label === 'Aguarda validação') return 'waiting';
      return '';
    }

    function showInline(element, message, type) {
      element.innerHTML = `<div class="${type}">${esc(message)}</div>`;
    }

    function showToast(message, ok) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'show ' + (ok ? 'ok' : 'bad');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.className = '', 3000);
    }

    function getErrorMessage(error) {
      return error && error.message ? error.message : String(error || 'Ocorreu um erro.');
    }

    function normalise(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function esc(value) {
      return String(value ?? '').replace(
        /[&<>'"]/g,
        char => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          "'":'&#39;',
          '"':'&quot;'
        }[char])
      );
    }

    function attr(value) {
      return esc(value).replace(/`/g, '&#96;');
    }

    function nl2br(value) {
      return esc(value).replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
